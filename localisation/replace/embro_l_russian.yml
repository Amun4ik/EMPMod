siam.11.d: "В ходе пограничных боёв наши войска не смогли организовать наступление в [1018.GetName] должным образом и враги отбили наши войска обратно за границу. Правительство [SIA.GetNameDefCap] пришлось ретироваться и выплатить компенсацию врагу."
siam.11.a: "Это позор!"
siam.12.t: "[SIA.GetNameDefCap] провоцирует пограничный конфликт"
siam.12.d: "После провала недавних переговоров с просьбами уступить некоторые территории в Индокитае мы заметили подозрительную активность войск [SIA.GetNameDefCap] на границе. Похоже, в любой момент они могут провоцировать пограничный конфликт с целью оккупировать наши территорию в бою."
siam.12.a: "Чёрт."
siam.13.t: "[SIA.GetNameDefCap] требует передать нам регионы [741.GetName] и [670.GetName]"
siam.13.d: "[SIA.GetNameDefCap] требует передать нам регионы [741.GetName] и [670.GetName]. Дальше лень писать я устал от графомании."
siam.13.a: "Нам придётся отступить."
siam.13.b: "Низачто."
siam.14.t: "[FROM.GetNameDefCap] отказались передать нам регионы [741.GetName] и [670.GetName]"
siam.14.d: "[FROM.GetNameDefCap] отказались передать нам регионы [741.GetName] и [670.GetName]"
siam.14.a: "В АТАКУ!"
