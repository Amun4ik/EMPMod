landmark_mitsubishi: "Заводы «Мицубиси»"
landmark_mitsubishi_desc: "Мицубиси - крупнейшее Дзайбацу в Японии. Сконцетриров огромное количество своих заводов вокруг Нагои, это Дзайбацу производит самые разные вещи нужные для страны, в том числе военные."
