SIA_demand_indochina: "Потребовать уступки в Индокитае"
siam.1.t: "[SIA.GetNameDefCap] требует уступки в Индокитае"
siam.1.d: "[SIA.GetNameDefCap] требует территориальные уступки у государства [ROOT.GetNameDefCap]. Их армия сильно выросла за последнее время, но наш генштаб уверен что они не решатся на военное вторжение. Тем не менее, нам нужно дать ответ на их запрос."
siam.1.a: "Мы можем договориться."
siam.1.b: "[SIA.GetNameDefCap] не заслуживает эти территории."
SIA_canleadtoborderwar: "§RМожет привести к пограничному конфликту!§!"
siam.2.t: "Требования [SIA.GetNameDefCap] удовлетворены"
siam.2.d: "Мы получили территории, потребованные у колониальной империи в Индокитае. Великая победа для нашего народа без единого выстрела."
siam.2.a: "Чудесно."
siam.3.t: "Требования [SIA.GetNameDefCap] проигнорированы"
siam.3.d: "Колониальная империя, держащая под контролем Индокитай, отказалась в решении наших территориальных претензий. Нам нужно смириться с этим или же начать готовить нашу страну к полномасштабной войне."
siam.3.a: "Нам нужно приготовиться к боестолкновению."
siam.3.b: "Нам придётся с этим смириться."
SIA_nowborderwar: "§RТеперь мы можем начать подготовку к пограничному конфликту.§!"
SIA_border_conflict: "Провоцировать пограничный конфликт"
SIA_border_conflict_warning: "Сиамская провокация в Индокитае"
siam.4.t: "[SIA.GetNameDefCap] оккупирует [1017.GetName]"
siam.4.d: "В ходе пограничных боёв наша оборона в регионе [1017.GetName] была прорвана и армия [SIA.GetNameDefCap] оккупировала наши территории. Нам пришлось идти на уступки и признать эту территорию за ними."
siam.4.a: "Это позор!"
siam.5.t: "[SIA.GetNameDefCap] оккупирует [1017.GetName]"
siam.5.d: "В ходе пограничных боёв наши войска успешно прорвали врага в регионе [1017.GetName] и армия [SIA.GetNameDefCap] освободила наши территории. Теперь им придётся идти на уступки и признать эту территорию за нами."
siam.5.a: "Великая победа!"
siam.6.t: "[SIA.GetNameDefCap] терпит поражение в [1017.GetName]"
siam.6.d: "В ходе пограничных боёв наши войска успешно отбили наступление врага в регионе [1017.GetName] и отбили неприятеля обратно за границу. [SIA.GetNameDefCap] придётся позорно ретироваться и выплачивать нам компенсацию."
siam.6.a: "Великая победа!"
siam.7.t: "[SIA.GetNameDefCap] терпит поражение в [1017.GetName]"
siam.7.d: "В ходе пограничных боёв наши войска не смогли организовать наступление в [1017.GetName] должным образом и враги отбили наши войска обратно за границу. Правительство [SIA.GetNameDefCap] пришлось ретироваться и выплатить компенсацию врагу."
