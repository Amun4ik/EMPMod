landmark_kaiser: "Верфи «Кайзер»"
landmark_kaiser_desc: "Огромная сеть частных судостроительных верфей, расположившаяся по всему западному побережью США с центром в Сан-Франциско. Эти верфи производят огромное количество как военного так и торгового флота."
