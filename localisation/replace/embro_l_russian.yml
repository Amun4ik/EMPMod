GER_weserubung_tt: "\nПолностью установив контроль над регионом §Y[144.GetName]§!, мы обеспечим себе ежемесячные поставки высококачественной руды через §YНарвик§! (§Y[SWE.GetName]§!): раз в 3 месяца мы будем получать по одной §Yвнешней фабрике§! и одному §Yвнешнему военному заводу§! — всего до двенадцати §Yвнешних фабрик§! и одному §Yвнешних военных заводов§!. Эти поставки прервутся, если §Y[144.GetName]§! выйдет из-под нашей власти. Если [ENG.GetNameDefCap] вторгнется в государство [SWE.GetName] и саботирует рудники либо если [SWE.GetNameDef] взорвет их самостоятельно, фабрики окажутся утрачены навсегда. Если возобновить работу рудников, возобновятся и поставки"
GER_weserubung_tt_complete: "§YВнешние фабрики§! и §Yвнешние военные заводы§!, полученные за владение §YНарвиком§!: §G[?GER_narvik_civs]§!\nХод поставок следующей фабрики: [?GER_narvik_shipments]/3"
